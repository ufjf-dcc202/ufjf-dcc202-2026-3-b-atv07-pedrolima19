    <style>

        em{
            color:orange;
        }

        code{
             color: lime; 
             text-decoration: underline; 
             font-family: sans-serif;
        }

    </style>

    <title>DCC202 CSS Embutido</title>
</head>
<body>
    <main>
        <h1>DCC202 CSS Embutido</h1>
        <p>Você pode aplicar um estilo <em>em linha</em> para um elemento usando o atributo<code> style</code><code> head</code></code></p>
        
        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>Cor texto do elemento.</dd>
            </div>
            <div>
                <dt><code>background-color</code></dt>
                <dd>Cor de fundo do elemento</dd>
            </div>
        </dl>

    </main>
